name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels an in-flight run rather than queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Quarry has no dependencies, so nothing is fetched and a build cannot be
  # broken by a registry outage. Failing on a network attempt makes an
  # accidentally added dependency loud rather than silent.
  CARGO_NET_OFFLINE: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        rust: [stable]
        include:
          # The declared MSRV, checked on one platform so a newer standard
          # library feature cannot slip in unnoticed.
          - os: ubuntu-24.04
            rust: "1.82"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustup default ${{ matrix.rust }}

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --all-targets --verbose

      - name: Doc tests
        run: cargo test --doc --verbose

  lint:
    name: Format and lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
