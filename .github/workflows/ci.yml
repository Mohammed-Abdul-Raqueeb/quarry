name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels an in-flight run rather than queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Quarry has no dependencies, so nothing is fetched and a build cannot be
  # broken by a registry outage. Failing on a network attempt makes an
  # accidentally added dependency loud rather than silent.
  CARGO_NET_OFFLINE: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        rust: [stable]
        include:
          # The declared MSRV, checked on one platform so a newer standard
          # library feature cannot slip in unnoticed.
          - os: ubuntu-24.04
            rust: "1.82"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustup default ${{ matrix.rust }}

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --all-targets --verbose

      - name: Doc tests
        run: cargo test --doc --verbose

  lint:
    name: Format and lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  no-dependencies:
    name: Dependency count is zero
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The headline claim in the README, enforced rather than asserted. The
      # lock file lists only the workspace members, so anything else means a
      # dependency was added.
      - name: Assert the lock file holds only workspace crates
        run: |
          cargo generate-lockfile --offline
          unexpected=$(
            grep '^name = ' Cargo.lock \
              | sed 's/name = "//; s/"//' \
              | grep -v '^quarry-' \
              || true
          )
          if [ -n "$unexpected" ]; then
            echo "::error::Quarry claims zero dependencies, but Cargo.lock lists:"
            echo "$unexpected"
            exit 1
          fi
          echo "Cargo.lock holds only workspace crates."

      - name: Assert no unsafe code
        run: |
          # `unsafe_code = "forbid"` already fails the build, so this only
          # catches an attempt to override it with an allow attribute.
          if grep -rn 'allow(unsafe_code)' crates/ benches/; then
            echo "::error::unsafe is forbidden workspace-wide"
            exit 1
          fi
          echo "No unsafe overrides."

  docs:
    name: Documentation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # `missing_docs` is a warning in the workspace lints, and RUSTFLAGS
      # promotes it, so an undocumented public item fails here.
      - name: Build documentation
        run: cargo doc --no-deps --all-features

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binaries
        run: cargo build --release --bins

      # Exercises the real binaries against a real index, which the unit tests
      # deliberately do not: they call the library directly.
      - name: Index, search, merge and serve
        run: |
          set -euo pipefail

          cat > docs.ndjson <<'EOF'
          {"title":"Rust ownership","body":"The borrow checker enforces ownership","tag":"rust","year":2021}
          {"title":"Zero cost abstractions","body":"Iterators compile to tight loops","tag":"rust","year":2019}
          {"title":"Fearless concurrency","body":"Rust prevents data races at compile time","tag":"rust","year":2020}
          {"title":"Python typing","body":"Gradual typing annotates incrementally","tag":"python","year":2022}
          EOF

          ./target/release/quarry index --index ./idx \
            --schema 'title:text,body:text,tag:keyword,year:numeric' \
            --input docs.ndjson --color never

          echo "--- a conjunction across two fields must match ---"
          ./target/release/quarry search --index ./idx 'rust AND concurrency' \
            --color never --no-snippets | tee out.txt
          grep -q 'Fearless concurrency' out.txt

          echo "--- a phrase must match ---"
          ./target/release/quarry search --index ./idx '"zero cost"' \
            --color never --no-snippets | grep -q 'Zero cost'

          echo "--- json output must be parseable ---"
          ./target/release/quarry search --index ./idx rust --json --color never \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total"] >= 1, d'
