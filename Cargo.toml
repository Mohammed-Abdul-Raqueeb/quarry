[workspace]
members = [
    "crates/quarry-core",
    "crates/quarry-query",
    "crates/quarry-cli",
    "crates/quarry-server",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.82"
authors = ["Mohammed Abdul Raqueeb"]
license = "MIT"
repository = "https://github.com/Mohammed-Abdul-Raqueeb/quarry"
description = "An embedded full-text search engine with no dependencies."

# Quarry has no external dependencies on purpose; see docs/architecture.md.
# Keeping `[workspace.dependencies]` empty is the enforcement of that.
[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Index arithmetic is pervasive in a postings codec and reads worse when
# rewritten to satisfy these.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# A codec or parser function is naturally long and splitting one to satisfy a
# line count makes the format harder to follow, not easier.
too_many_lines = "allow"
# Flags pairs like `doc`/`docs` and `field`/`fields`, which are the clearest
# names available here.
similar_names = "allow"
# Wants every assert!(x.is_empty()) rewritten as assert_eq!(x, [] as [T; 0]).
# The point -- printing what was found when the assertion fails -- is fair, but
# the form it asks for is harder to read than the one it replaces, and the test
# suite asserts emptiness in about twenty-five places. Where showing the value
# genuinely helps, the test binds it and compares explicitly instead.
assert_is_empty = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true
